# Production deployment on an Amp obelisk (`amp apps obelisk-deploy amp/curiosity-collector`).
# The obelisk is one long-lived sandbox with this repo checked out at /home/user/workspace/app;
# the SQLite database below lives outside the checkout and survives deploys.
build: pnpm install --frozen-lockfile && pnpm build
services:
  web:
    # SvelteKit needs ORIGIN for form posts; adapter-node normalizes it to url.origin, so the
    # trailing slash on AMP_DEPLOYMENT_URL is fine. (systemd expands $VAR/${VAR} in ExecStart
    # itself, so bash-only syntax like ${VAR%/} would come out empty.)
    command: ORIGIN=$AMP_DEPLOYMENT_URL node build
    env:
      DATABASE_PATH: /home/user/data/collector.db
